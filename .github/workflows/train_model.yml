name: Train model

on:
  workflow_dispatch:
    inputs:
      train_station:
        description: "Station to train, e.g. E410 or all"
        required: true
        default: "E410"
        type: string
  workflow_run:
    workflows: ["Fetch data on schedule"]
    types:
      - completed

permissions:
  contents: write

jobs:
  train_model:
    name: Train air quality model
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: DVC pull data
        run: |
          test -n "${{ secrets.DAGSHUB_ACCESS_KEY_ID }}" || { echo "Missing secret: DAGSHUB_ACCESS_KEY_ID"; exit 1; }
          test -n "${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}" || { echo "Missing secret: DAGSHUB_SECRET_ACCESS_KEY"; exit 1; }
          dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_ACCESS_KEY_ID }}
          dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}
          dvc pull

      - name: Run training pipeline
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          TRAIN_STATION: ${{ github.event.inputs.train_station || 'E410' }}
        run: |
          if [ -n "${MLFLOW_TRACKING_USERNAME}" ] && [ -n "${MLFLOW_TRACKING_PASSWORD}" ]; then
            export MLFLOW_TRACKING_URI="https://dagshub.com/KvarticJan/IIS_2026.mlflow"
            echo "Using DagsHub MLflow tracking."
          else
            echo "MLflow secrets are missing. Falling back to local tracking."
          fi
          echo "Training station selection: ${TRAIN_STATION}"
          echo "Forcing train stage so MLflow receives a run even when DVC outputs are up to date."
          dvc repro --force --single-item train

      - name: Push DVC artifacts
        run: dvc push

      - name: Commit model changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add dvc.lock
          git commit -m "Train model with GitHub Actions" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
