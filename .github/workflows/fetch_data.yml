name: Fetch data on schedule

on:
  workflow_dispatch:
    inputs:
      refresh_reference:
        description: "Refresh Evidently reference files if drift is detected"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  fetch_air:
    name: Fetch, validate and test air data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: DVC pull data
        run: |
          test -n "${{ secrets.DAGSHUB_ACCESS_KEY_ID }}" || { echo "Missing secret: DAGSHUB_ACCESS_KEY_ID"; exit 1; }
          test -n "${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}" || { echo "Missing secret: DAGSHUB_SECRET_ACCESS_KEY"; exit 1; }
          dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_ACCESS_KEY_ID }}
          dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}
          dvc pull

      - name: Run DVC data pipeline
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.refresh_reference }}" = "true" ]; then
            export EVIDENTLY_REFRESH_REFERENCE_ON_FAILURE=1
            echo "Evidently reference refresh is enabled for this run."
          else
            echo "Evidently reference refresh is disabled for this run."
          fi
          dvc repro fetch preprocess validate test_data

      - name: Push DVC artifacts
        run: dvc push

      - name: Commit data changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add dvc.lock
          git commit -m "Update air data artifacts with GitHub Actions" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
